plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
apply plugin: 'org.spongepowered.mixin'

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

version = mod_version
group = maven_group // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = archives_base_name

// set java version
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// required for making a functional mod
sourceSets.main.resources.srcDirs += 'src/generated/resources'
mixin.add sourceSets.main, "webdisplays.refmap.json"

// forge gradle
minecraft {
    mappings channel: 'parchment', version: '2022.11.27-1.19.2'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        client {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            arg "-mixin.config=webdisplays.mixins.json"
            property 'forge.logging.console.level', 'debug'

            mods {
                webdisplays {
                    source sourceSets.main
                }
            }
        }

        server {
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            workingDirectory project.file('run')
            arg "-mixin.config=webdisplays.mixins.json"


            property 'forge.logging.console.level', 'debug'

            mods {
                webdisplays {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            properties 'mixin.env.remapRefMap': 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'webdisplays', '--all', '--output', file('src/generated/resources/'), '--existing', sourceSets.main.resources.srcDirs[0]
            mods {
                webdisplays {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories{
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "cursemaven"
        url = "https://www.cursemaven.com"
    }
    // MCEF 2.x backported to 1.19.2 (built from ../mcef-1.19.2, installed with publishToMavenLocal)
    mavenLocal()
}

configurations {
    // libraries shaded into the mod jar (and put on the dev runtime module path)
    shade
    implementation.extendsFrom shade
    minecraftLibrary.extendsFrom shade
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.5.2'

    // screen streaming: FFmpeg (LGPL build) through JavaCPP
    shade "org.bytedeco:javacpp:${javacpp_version}"
    shade "org.bytedeco:javacpp:${javacpp_version}:${natives_platform}"
    shade "org.bytedeco:ffmpeg:${ffmpeg_version}"
    shade "org.bytedeco:ffmpeg:${ffmpeg_version}:${natives_platform}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // here because we need to manually open the VR keyboard
    compileOnly fg.deobf("maven.modrinth:vivecraft:1.19.2-1.3.15-forge")

    implementation fg.deobf("com.cinemamod:mcef-forge:2.1.6-1.19.2") {
        transitive = false
    }
}

// List of bundled native libraries, so they can be extracted from the mod jar at runtime
// (Forge's union filesystem gets in the way of JavaCPP's own extraction)
def nativesListDir = layout.buildDirectory.dir('generated/natives-list')
tasks.register('generateNativesList') {
    inputs.files(configurations.shade)
    outputs.dir(nativesListDir)
    doLast {
        def names = new TreeSet<String>()
        configurations.shade.files.findAll { it.name.contains(natives_platform) }.each { f ->
            zipTree(f).visit { d ->
                if (!d.directory && d.path.startsWith('org/bytedeco/') && d.path.contains("/${natives_platform}/") && d.path.endsWith('.dll'))
                    names << d.path
            }
        }
        def out = nativesListDir.get().file('META-INF/webdisplays-natives.txt').asFile
        out.parentFile.mkdirs()
        out.text = names.join('\n') + '\n'
    }
}
sourceSets.main.resources.srcDir(nativesListDir)
processResources.dependsOn generateNativesList

// jar meta-info
jar {
    dependsOn configurations.shade
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.shade.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                '**/module-info.class', 'META-INF/native-image/**', '**/*.exe'
    }
    manifest {
        attributes([
                "Specification-Title": "WebDisplays",
                "Specification-Vendor": "CinemaMod Group",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": "CinemaMod Group",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "webdisplays.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Standalone encoder/decoder benchmark (no Minecraft needed): ./gradlew streamBench
tasks.register('streamBench', JavaExec) {
    group = 'webdisplays'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'StreamBench'
    jvmArgs "-Dorg.bytedeco.javacpp.cachedir=${layout.buildDirectory.dir('javacpp-cache').get().asFile}"
}
